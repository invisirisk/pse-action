name: 'InvisiRisk PSE Security Proxy'
description: 'Sets up PSE Security Proxy for secure package downloads'
author: 'InvisiRisk'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api_url:
    description: 'InvisiRisk API URL'
    required: false
    default: 'https://app.invisirisk.com'
  app_token:
    description: 'Authentication token for the InvisiRisk API'
    required: true
  github_token:
    description: 'GitHub token for API access (auto-populated, no need to set explicitly)'
    required: false
    default: ${{ github.token }}
  debug:
    description: 'Enable debug mode for verbose logging'
    required: false
    default: 'false'
  mode:
    description: 'The operation mode: "native" (default) downloads and runs the PSE binary directly, "sidecar" pulls and runs the PSE proxy as a Docker container.'
    required: false
    default: 'native'
  pse_image_tag:
    description: 'Sidecar mode only: tag for the fixed invisirisk/pse-proxy image. Defaults to latest.'
    required: false
    default: 'latest'
  collect_dependencies:
    description: 'Set to true to collect dependency graphs during cleanup, false to skip. Default is true if not specified.'
    required: false
    default: ''
  collect_job_status:
    description: 'Set to true to collect GitHub Actions workflow status during cleanup, false to skip. Default is true if not specified.'
    required: false
    default: 'true'
  workdir:
    description: 'Working directory to use as the project path for dependency graph collection. Defaults to the current directory (pwd) if not specified.'
    required: false
    default: ''
  send_job_status:
    description: '[DEPRECATED] GitHub Actions workflow status collection is now handled internally by the action and this input does nothing. Will be removed in a future release.'
    required: false
    default: 'false'
  cleanup:
    description: '[DEPRECATED] Cleanup is now handled internally by the action and this input does nothing. Will be removed in a future release.'
    required: false
    default: 'false'

runs:
  using: 'node20'
  main: 'src/index.js'
  post: 'src/post.js'
  post-if: always()
